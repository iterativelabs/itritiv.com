<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>itritiv</title>
<meta name="description" content="itritiv">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231f2328'/><text x='8' y='12.5' font-size='12' text-anchor='middle' fill='%23fff' font-family='Helvetica,Arial,sans-serif' font-weight='300'>i</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6e7781;
    --rule: #d1d9e0;
    --accent: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --rule: #30363d;
      --accent: #4493f8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main { text-align: center; }
  .wordmark {
    margin: 0;
    font-size: clamp(2.75rem, 10vw, 4.5rem);
    font-weight: 300;
    letter-spacing: 0.14em;
    /* offset trailing letter-spacing so the word stays optically centred */
    margin-right: -0.14em;
    line-height: 1;
  }
  .wordmark .dot { color: var(--accent); }
  hr {
    width: 48px;
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 28px auto;
  }
  .contact { margin: 0; font-size: 0.95rem; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">itritiv<span class="dot">.</span></h1>
  <hr>
  <p class="contact" id="contact">
    <noscript>contact at itritiv dot com</noscript>
  </p>
</main>
<script>
  (function () {
    var u = 'contact', d = 'itritiv.com', a = document.createElement('a');
    a.href = 'mailto:' + u + '@' + d;
    a.textContent = u + '@' + d;
    document.getElementById('contact').appendChild(a);
  })();
</script>
</body>
</html>
